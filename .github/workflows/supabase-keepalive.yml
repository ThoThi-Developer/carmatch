name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Chave PÚBLICA (pode ficar no arquivo). A anon antiga sai com a troca de chaves (H4).
      - name: Ping Supabase health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://saelhbdtbatnzdypktkr.supabase.co/rest/v1/lojas?select=id&limit=1" \
            -H "apikey: sb_publishable_xcZxOY-oq6ZjTUg7tyZ5UA_8-wutnQZ")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Unexpected status $STATUS — Supabase down, paused, or the key was rejected."
            exit 1
          fi
          echo "Supabase is alive."
