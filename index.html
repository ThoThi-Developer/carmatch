<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site em manutenção</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f7f5f4; color: #1c1a19; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #171412; color: #efeae6; }
    .muted { color: #a39b94 !important; }
  }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
  p  { font-size: 1rem; line-height: 1.55; }
  .muted { color: #6f6862; font-size: 0.875rem; margin-top: 20px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Site em manutenção</h1>
  <p>Estamos trabalhando em melhorias. O aplicativo continua funcionando
     normalmente para os usuários.</p>
  <p class="muted">Suporte: <a href="mailto:support@thothi.com.br">support@thothi.com.br</a></p>
</main>
</body>
</html>
